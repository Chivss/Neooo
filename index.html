<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8e6eb">
  <title>Letter for Neo ♡</title>

  <link rel="stylesheet" href="mails/assets/css/styles.css?v=15">
  <script defer src="mails/assets/js/shared.js?v=11"></script>
  <script defer src="mails/assets/js/lock.js?v=11"></script>
</head>
<body>
<header class="topbar">
  <span class="brand">with love,</span>
  <span>A little something, just for you</span>
</header>
<span aria-hidden="true" class="ornament o1">♡</span>
<span aria-hidden="true" class="ornament o2">✧</span>
<span aria-hidden="true" class="ornament o3">✧</span>
<span aria-hidden="true" class="ornament o4">♡</span>
<main>
  <section class="screen" id="lock-screen" aria-labelledby="lock-title">
    <div class="lock-wrap" aria-hidden="true">
      <div class="halo">
      </div>
      <div class="lock">
        <div class="shackle">
        </div>
        <div class="keyhole">
        </div>
      </div>
    </div>
    <p class="eyebrow">Sealed with a little love</p>
    <h1 id="lock-title">Some things are<br>
      <em>only for you.</em>
    </h1>
    <p class="subtitle">A little secret. A little surprise.<br>Enter our special code to see what’s inside.</p>
    <form id="unlock-form">
      <label for="password" class="input-label">Your secret code</label>
      <input id="password" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="••••" autocomplete="off" required aria-describedby="error">
      <button class="primary" type="submit">Unlock my letter <span aria-hidden="true">♡</span>
    </button>
    <p class="error" id="error" role="status" aria-live="polite">
    </p>
  </form>
  <p class="hint">Four little numbers, one special meaning.</p>
</section>
</main>
<footer class="footer">Made <span>♡</span> with <span>♡</span> love </footer>
  <noscript>Please enable JavaScript to open your letter.</noscript>
</body>
</html>
