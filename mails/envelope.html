<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8e6eb">
  <title>Letter for Neo ♡</title>

  <link rel="stylesheet" href="assets/css/styles.css?v=15">
  <script defer src="assets/js/shared.js?v=11"></script>
  <script defer src="assets/js/envelope.js"></script>
</head>
<body>
<header class="topbar">
  <span class="brand">with love,</span>
  <span>A little something, just for you</span>
</header>
<span aria-hidden="true" class="ornament o1">♡</span>
<span aria-hidden="true" class="ornament o2">✧</span>
<span aria-hidden="true" class="ornament o3">✧</span>
<span aria-hidden="true" class="ornament o4">♡</span>
<main>
  <section class="screen" id="envelope-screen" aria-labelledby="envelope-title">
    <p class="eyebrow">A special delivery</p>
    <h1 id="envelope-title" tabindex="-1">You have <em>my heart.</em>
  </h1>
  <p class="subtitle">And a letter waiting to be opened.</p>
  <div class="envelope-stage" aria-hidden="true">
    <div class="envelope">
      <div class="envelope-back">
      </div>
      <div class="mini-letter">Just for you.</div>
      <div class="envelope-front">
      </div>
      <div class="flap">
      </div>
      <div class="seal">♡</div>
    </div>
  </div>
  <p class="hint" role="status">Opening your little surprise…</p>
</section>
</main>
<footer class="footer">Made <span>♡</span> with <span>♡</span> love </footer>
  <noscript>Please enable JavaScript to open your letter.</noscript>
</body>
</html>
